# test.cfg — main config file for testconfig


########
# basic types

MYINT=42
MYFLOAT=3.14
MYBOOL_T=true
MYBOOL_F=false
MYSTRING="hello world "

# inline comment should not affect value
MYVERSION="1" # version string

########
# string concatenation with +

MYCAT = MYSTRING + "foo"
MYCAT2 = "abc" + "def" + "ghi"

# concat with number coercion
MYCAT3 = "v" + MYINT

########
# array literal

MYARRAY=[ 0, 1, 2, 3, "four", "five" ]

########
# array indexing

ARRVAL0 = MYARRAY[0]
ARRVAL1 = MYARRAY[1]
ARRVAL4 = MYARRAY[4]

########
# variable reference on RHS

MYINT2 = MYINT

########
# += append operator

MYAPPEND = "hello"
MYAPPEND += " world"

########
# include another file

include included.cfg

########
# variable set in included file used here

COMBINED = INCLUDED_VAR + " and " + MYSTRING + "bar"

########
# display directive (output goes to stdout during load)

display "Config loaded, version=" + MYVERSION
